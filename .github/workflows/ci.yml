name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dashboard:
    name: portfolio-dashboard (型チェック・テスト・ビルド)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Node をセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: portfolio-dashboard/package-lock.json

      - name: 依存関係をインストール
        working-directory: portfolio-dashboard
        run: npm ci

      - name: 型チェック（server + client）
        working-directory: portfolio-dashboard
        run: npm run check

      - name: テスト（server + client）
        working-directory: portfolio-dashboard
        run: npm run test

      - name: ビルド
        working-directory: portfolio-dashboard
        run: npm run build

  collector:
    name: collector (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: uv をセットアップ
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest"
          enable-cache: false

      - name: ruff lint
        working-directory: portfolio-dashboard/collector
        run: uv run ruff check .
